# Multi-platform build for Privoo.
#
# Triggers:
#   • push to main / master   → CI build (artifacts uploaded, not released)
#   • a v*.*.* tag is pushed  → CI build + draft release with installers
#   • manually (workflow_dispatch)
#
# Each platform runs on its native runner so electron-builder can produce
# native installers (NSIS .exe for Windows, .dmg/.zip for macOS, AppImage /
# .deb / .rpm for Linux). Artifacts land in the workflow run.

name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: dist/*.exe
          - os: macos-latest
            name: macos
            artifact: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            name: linux
            artifact: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Linux needs rpmbuild for .rpm targets; ubuntu-latest doesn't ship it.
      - name: Install rpm tooling (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist
        env:
          # electron-builder uses this to push to GitHub Releases on tag
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip notarization for CI builds (no Apple developer creds available).
          # Releases will be signed/notarized manually if needed.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privoo-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14

  # Release creation is handled exclusively by release.yml to avoid the
  # draft-vs-published conflict that made electron-updater miss updates.
