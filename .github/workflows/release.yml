name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exclude workspace from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Verify exe hash matches latest.yml
        shell: powershell
        run: |
          $exe = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -notlike "*.blockmap" } | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe found in dist"; exit 1 }
          $hashHex = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash
          $hashBytes = [byte[]]::new(64)
          for ($i = 0; $i -lt 64; $i++) { $hashBytes[$i] = [Convert]::ToByte($hashHex.Substring($i * 2, 2), 16) }
          $hashBase64 = [Convert]::ToBase64String($hashBytes)
          $yml = Get-Content dist/latest.yml -Raw
          if ($yml -notmatch [regex]::Escape($hashBase64)) {
            Write-Error "Hash mismatch — exe was modified after latest.yml was generated. Exe hash: $hashBase64"
            exit 1
          }
          Write-Host "Hash verified: $hashBase64"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/Privoo-Setup-*.exe
            dist/Privoo-Setup-*.exe.blockmap
            dist/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
