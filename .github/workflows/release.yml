name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Privoo ${{ github.ref_name }}" \
            --notes "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection." \
            2>/dev/null || true
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Privoo ${{ github.ref_name }}" \
            --notes "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection." \
            2>/dev/null || true
          # Upload installer first, then latest.yml last so the hash file
          # is only updated once the binary it references is already present.
          find dist -maxdepth 1 -type f \( \
            -name "*.exe" -o -name "*.exe.blockmap" \
          \) | while IFS= read -r f; do
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" \
              --repo "${{ github.repository }}" --clobber || true
          done
          find dist -maxdepth 1 -type f -name "latest.yml" | while IFS= read -r f; do
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" \
              --repo "${{ github.repository }}" --clobber || true
          done

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Privoo ${{ github.ref_name }}" \
            --notes "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection." \
            2>/dev/null || true
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Privoo ${{ github.ref_name }}" \
            --notes "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection." \
            2>/dev/null || true
          # Upload binaries first, then latest-mac.yml last.
          find dist -maxdepth 1 -type f \( \
            -name "*.dmg" -o -name "*.dmg.blockmap" \
            -o -name "*.zip" -o -name "*.zip.blockmap" \
          \) | while IFS= read -r f; do
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" \
              --repo "${{ github.repository }}" --clobber || true
          done
          find dist -maxdepth 1 -type f -name "latest-mac.yml" | while IFS= read -r f; do
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" \
              --repo "${{ github.repository }}" --clobber || true
          done

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Privoo ${{ github.ref_name }}" \
            --notes "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection." \
            2>/dev/null || true
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Privoo ${{ github.ref_name }}" \
            --notes "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection." \
            2>/dev/null || true
          # Upload binaries first, then latest-linux.yml last.
          find dist -maxdepth 1 -type f \( \
            -name "*.AppImage" \
            -o -name "*.deb" \
            -o -name "*.rpm" \
          \) | while IFS= read -r f; do
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" \
              --repo "${{ github.repository }}" --clobber || true
          done
          find dist -maxdepth 1 -type f -name "latest-linux.yml" | while IFS= read -r f; do
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" \
              --repo "${{ github.repository }}" --clobber || true
          done
