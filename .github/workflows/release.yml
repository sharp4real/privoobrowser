name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable Windows Defender realtime monitoring
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      # Upload exe first — no latest.yml yet. We will hash whatever GitHub
      # actually serves (CDN bytes may differ from local dist/ bytes if
      # Defender touches the file during upload). Only after we have
      # confirmed the CDN hash do we write and upload latest.yml.
      - name: Upload installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: dist/Privoo-Setup-*.exe

      - name: Hash CDN-served exe and write latest.yml
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag     = $env:TAG
          $version = $tag -replace '^v', ''
          $exeName = "Privoo-Setup-$version.exe"
          $url     = "https://github.com/sharp4real/privoobrowser/releases/download/$tag/$exeName"
          $tmp     = Join-Path $env:RUNNER_TEMP "privoo_cdn.exe"

          Write-Host "Waiting for CDN: $url"
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 20
            try {
              curl.exe -fsSL --retry 3 -o $tmp $url
              if ($LASTEXITCODE -eq 0) {
                $sz = (Get-Item $tmp -ErrorAction SilentlyContinue).Length
                if ($sz -gt 1MB) { $ok = $true; Write-Host "Downloaded $sz bytes on attempt $($i+1)"; break }
              }
            } catch {}
            Write-Host "Retry $($i+1)..."
          }
          if (-not $ok) { Write-Error "Could not download published exe from CDN"; exit 1 }

          $sha    = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead($tmp)
          $bytes  = $sha.ComputeHash($stream)
          $stream.Close()
          $hash   = [Convert]::ToBase64String($bytes)
          $size   = (Get-Item $tmp).Length
          $date   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          $yml = @"
          version: $version
          files:
            - url: $exeName
              sha512: $hash
              size: $size
          path: $exeName
          sha512: $hash
          releaseDate: '$date'
          "@
          # Strip leading whitespace from here-string indentation
          $yml = ($yml -split "`n" | ForEach-Object { $_ -replace '^\s{10}','' }) -join "`n"
          Set-Content -Path "dist\latest.yml" -Value $yml -Encoding utf8NoBOM -NoNewline:$false
          Write-Host "sha512: $hash"
          Write-Host "size:   $size"

      - name: Upload latest.yml
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: dist/latest.yml

  build-mac:
    # Use Intel macOS so we can cross-compile x64 + arm64 dmg/zip without
    # the arch-specific native-module pitfalls macos-latest (arm64) has.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder warns + sometimes fails when no Apple ID/cert
          # is configured — silence the prompt and skip notarization.
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: npm run dist:mac

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
