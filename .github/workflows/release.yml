name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci doesn't reliably run the castLabs electron fork's binary
      # download, leaving node_modules/electron/dist empty and breaking
      # electron-builder's electronDist path. Fetch it explicitly.
      - name: Download castLabs Electron binary
        run: node node_modules/electron/install.js

      - name: Set up Python (for Widevine VMP signing)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EVS (castLabs VMP signer)
        run: python -m pip install --upgrade castlabs-evs

      - name: Disable Windows Defender realtime monitoring
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Diagnostic: proves whether GitHub is actually injecting the EVS secrets.
      # Prints presence + length ONLY — never the values, which GitHub would mask
      # anyway. Without this, a missing secret is indistinguishable from a wrong
      # one: the VMP hook skips silently and the build still goes green.
      - name: Verify EVS credentials reach the runner
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -n "$EVS_ACCOUNT_NAME" ]; then
            echo "EVS_ACCOUNT_NAME: PRESENT (length ${#EVS_ACCOUNT_NAME})"
          else
            echo "EVS_ACCOUNT_NAME: MISSING / EMPTY"
          fi
          if [ -n "$EVS_PASSWD" ]; then
            echo "EVS_PASSWD: PRESENT (length ${#EVS_PASSWD})"
          else
            echo "EVS_PASSWD: MISSING / EMPTY"
          fi

      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Widevine VMP signing — afterSign-vmp.js signs the packed app so
          # Spotify/Netflix will issue licenses. If these secrets are unset the
          # hook skips signing and still produces a working (non-DRM) installer.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        # Tee the log so the next step can assert VMP signing actually ran. The
        # hook is designed to skip (not fail) without credentials, so a build can
        # otherwise go green while shipping an unverifiable CDM — which is exactly
        # how v4.0.3 and v4.0.4 shipped broken DRM.
        run: npm run dist 2>&1 | tee build.log

      # Fail the release rather than publish an installer whose Widevine CDM
      # can't get a license. Also guards the ordering bug: if the afterSign hook
      # ever stops firing (electron-builder skips it when no signing occurred),
      # the completion line disappears and we catch it here instead of shipping.
      - name: Assert Widevine VMP signing ran
        shell: bash
        run: |
          if grep -q "\[VMP\] Widevine VMP signing complete\." build.log; then
            echo "OK: Widevine VMP signing completed."
          else
            echo "::error::Widevine VMP signing did NOT complete — refusing to publish."
            echo "----- VMP-related log lines -----"
            grep -i "vmp\|afterSign\|signtool" build.log || echo "(none found)"
            exit 1
          fi

      - name: Recompute sha512 after AV scan
        shell: node {0}
        run: |
          const { createHash } = require('crypto');
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('fs');
          const { join } = require('path');
          const dist = 'dist';
          const exeFile = readdirSync(dist).find(f => f.endsWith('.exe') && !f.endsWith('.blockmap'));
          if (!exeFile) { console.error('No exe found in dist'); process.exit(1); }
          const exePath = join(dist, exeFile);
          const hash = createHash('sha512').update(readFileSync(exePath)).digest('base64');
          const size = statSync(exePath).size;
          const ymlPath = join(dist, 'latest.yml');
          let yml = readFileSync(ymlPath, 'utf8');
          yml = yml.replace(/sha512: \S+/g, 'sha512: ' + hash);
          yml = yml.replace(/size: \d+/g, 'size: ' + size);
          writeFileSync(ymlPath, yml);
          console.log('sha512:', hash);
          console.log('size:', size);

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/Privoo-Setup-*.exe
            dist/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci doesn't reliably run the castLabs electron fork's binary
      # download, leaving node_modules/electron/dist empty and breaking
      # electron-builder's electronDist path. Fetch it explicitly.
      - name: Download castLabs Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # electron-builder warns + sometimes fails when no Apple ID/cert
          # is configured — silence the prompt and skip notarization.
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: npm run dist:mac

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci doesn't reliably run the castLabs electron fork's binary
      # download, leaving node_modules/electron/dist empty and breaking
      # electron-builder's electronDist path. Fetch it explicitly.
      - name: Download castLabs Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
