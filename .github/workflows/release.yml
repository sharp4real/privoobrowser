name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable Windows Defender realtime monitoring
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Recompute sha512 after AV scan
        shell: powershell
        run: |
          $exe = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -notlike "*.blockmap" } | Select-Object -First 1
          if (-not $exe) { Write-Error "No exe found in dist"; exit 1 }
          $hashHex = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash
          $hashBytes = [byte[]]::new(64)
          for ($i = 0; $i -lt 64; $i++) { $hashBytes[$i] = [Convert]::ToByte($hashHex.Substring($i * 2, 2), 16) }
          $hashBase64 = [Convert]::ToBase64String($hashBytes)
          $size = $exe.Length
          $content = Get-Content dist\latest.yml -Raw
          $content = [regex]::Replace($content, 'sha512: \S+', "sha512: $hashBase64")
          $content = [regex]::Replace($content, 'size: \d+', "size: $size")
          [System.IO.File]::WriteAllText((Resolve-Path dist\latest.yml), $content)
          Write-Host "sha512: $hashBase64 size: $size"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/Privoo-Setup-*.exe
            dist/Privoo-Setup-*.exe.blockmap
            dist/latest.yml

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:linux

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Privoo ${{ github.ref_name }}
          body: "Privoo Browser ${{ github.ref_name }}. No telemetry. No tracking. No data collection."
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml
