<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#f1f3fd"/><stop offset="1" stop-color="#e2e7fa"/>
  </linearGradient>
  <radialGradient id="key" cx="0.15" cy="0.08" r="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rA" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#eaeefc"/><stop offset="0.5" stop-color="#c3cdf7"/><stop offset="1" stop-color="#8fa0f0"/>
  </linearGradient>
  <linearGradient id="rB" x1="0" y1="0" x2="0.12" y2="1">
    <stop offset="0" stop-color="#c3cdf7"/><stop offset="0.5" stop-color="#8fa0f0"/><stop offset="1" stop-color="#4356cc"/>
  </linearGradient>
  <linearGradient id="rC" x1="0" y1="0" x2="0.1" y2="1">
    <stop offset="0" stop-color="#8fa0f0"/><stop offset="0.5" stop-color="#5c6fe8"/><stop offset="1" stop-color="#4356cc"/>
  </linearGradient>
  <linearGradient id="rD" x1="0" y1="0" x2="0.08" y2="1">
    <stop offset="0" stop-color="#5c6fe8"/><stop offset="0.6" stop-color="#4356cc"/><stop offset="1" stop-color="#4356cc"/>
  </linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#key)"/>

<!-- Band A — widest, most translucent, sweeps from top-left -->
<path fill="url(#rA)" fill-opacity="0.65" d="M-80,120
  C 260,60 520,220 760,420
  C 1040,660 1300,760 1620,700
  C 1780,668 1900,600 1990,540
  L 1990,-80 L -80,-80 Z"/>

<!-- Band B -->
<path fill="url(#rB)" fill-opacity="0.85" d="M-80,340
  C 220,220 480,340 700,540
  C 960,780 1220,880 1540,800
  C 1720,754 1860,660 1990,580
  L 1990,-80 L -80,-80 Z"/>

<!-- Band C -->
<path fill="url(#rC)" fill-opacity="0.92" d="M-80,560
  C 180,420 420,500 620,660
  C 860,858 1100,940 1400,860
  C 1600,806 1780,690 1990,600
  L 1990,-80 L -80,-80 Z"/>

<!-- Band D — narrowest, most vivid, closest to the key light -->
<path fill="url(#rD)" fill-opacity="0.95" d="M-80,760
  C 140,620 340,660 500,780
  C 700,930 900,990 1140,920
  C 1340,864 1540,760 1780,660
  C 1860,626 1930,598 1990,580
  L 1990,-80 L -80,-80 Z"/>

<!-- Specular crest lines -->
<path fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"
  d="M-80,760 C 140,620 340,660 500,780 C 700,930 900,990 1140,920 C 1340,864 1540,760 1780,660"/>
<path fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1.6" stroke-linecap="round"
  d="M-80,560 C 180,420 420,500 620,660 C 860,858 1100,940 1400,860"/>
<path fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.3" stroke-linecap="round"
  d="M-80,340 C 220,220 480,340 700,540 C 960,780 1220,880 1540,800"/>
</svg>