<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Nothing here. Privoo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238b7cf7' d='M12 2 4 5v6c0 5 3.4 9.4 8 10.6 4.6-1.2 8-5.6 8-10.6V5l-8-3z'/%3E%3Cpath fill='%23fff' d='M10.6 15.4 7.4 12.2l1.3-1.3 1.9 1.9 4-4 1.3 1.3z'/%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}

:root{
  --bg:#f1f3f4;
  --surface:#ffffff;
  --text:#1e1e21;
  --muted:#4d4d57;
  --border:#d8d8de;
  --hover:#ededf0;
  --accent:#8ab4f8;
  --accent-hover:#a0c2fa;
  --on-accent:#1e1e21;
}
body.dark{
  --bg:#1e1e21;
  --surface:#37373f;
  --text:#ededf0;
  --muted:#b0b0b8;
  --border:#43434c;
  --hover:#3c4043;
  color-scheme:dark;
}
/* ── Privoo studio palette ── */
:root{ --accent:#4f46e5; --accent-hover:#6058ea;
  --bg:#f3f3f7; --surface:#ffffff; --text:#17171f; --muted:#6c6c78; --border:rgba(23,23,31,.09); --hover:rgba(23,23,31,.05); }
body.dark{ --accent:#948ef2; --accent-hover:#a29cf5;
  --bg:#1e1e21; --surface:#28282c; --text:#ededf0; --muted:#b0b0b8; --border:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06); }

html,body{height:100%;background:var(--bg);color:var(--text);user-select:none;}

.page{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:40px 24px;
}

.card{
  width:100%;max-width:520px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:44px 44px 36px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  text-align:center;
  animation:fadein .25s ease;
}
body.dark .card{box-shadow:0 2px 16px rgba(0,0,0,.35)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Logo */
.logo-wrap{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:24px;
}
.logo-wrap img{
  width:64px;height:64px;
  border-radius:10px;
  display:block;
  opacity:.92;
}

h1{
  font-size:22px;font-weight:700;
  margin-bottom:10px;
  color:var(--text);
}

.subtitle{
  font-size:14px;line-height:1.65;
  color:var(--muted);
  margin-bottom:8px;
}

.url-chip{
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12.5px;
  color:var(--muted);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:4px 14px;
  margin:12px 0 20px;
  user-select:text;
}

.error-code{
  font-size:11.5px;
  color:var(--muted);
  opacity:.55;
  margin-bottom:28px;
  font-family:monospace;
}

.actions{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
}
button{
  font-family:inherit;font-size:13.5px;font-weight:500;
  height:36px;padding:0 22px;
  border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  cursor:pointer;transition:background .12s,border-color .12s;
}
button:hover{background:var(--hover)}
button.primary{
  background:var(--accent);color:var(--on-accent);border-color:var(--accent);
}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.ghost{
  background:transparent;border-color:transparent;color:var(--muted);
}
button.ghost:hover{background:var(--hover);color:var(--text)}
</style>
<!-- Shared finish pass: one palette across every Privoo page. Loads last so
     it wins on order; the block above still owns this page's layout. -->
<link rel="stylesheet" href="page-theme.css" />
</head>
<body>
<div class="page">
  <div class="card">

    <div class="logo-wrap">
      <img src="privoo://newtab/logo.png" alt="Privoo" draggable="false"/>
    </div>

    <h1 id="headline">Nothing here to find.</h1>
    <p class="subtitle" id="subtitle">Privoo couldn't load this page. The site might be down, the address might be wrong, or there's no internet connection.</p>
    <div class="url-chip" id="url-chip"></div>
    <div class="error-code" id="error-code"></div>
    <div class="actions">
      <button type="button" id="back-btn" class="ghost">Go back</button>
      <button type="button" id="retry-btn" class="primary">Try again</button>
    </div>

  </div>
</div>

<script>
(function(){
  const api = window.privooInternal;

  const params     = new URLSearchParams(location.search);
  const failedUrl  = params.get('url')  || '';
  const errorCode  = params.get('code') || '';

  const headlineEl  = document.getElementById('headline');
  const subtitleEl  = document.getElementById('subtitle');
  const urlChip     = document.getElementById('url-chip');
  const errorCodeEl = document.getElementById('error-code');

  const DNS_ERRORS  = ['ERR_NAME_NOT_RESOLVED','ERR_NAME_RESOLUTION_FAILED','ERR_DNS_TIMED_OUT'];
  const CONN_ERRORS = ['ERR_CONNECTION_REFUSED','ERR_CONNECTION_TIMED_OUT','ERR_CONNECTION_RESET',
                       'ERR_CONNECTION_CLOSED','ERR_NETWORK_CHANGED','ERR_INTERNET_DISCONNECTED',
                       'ERR_ADDRESS_UNREACHABLE','ERR_EMPTY_RESPONSE'];
  const SSL_ERRORS  = ['ERR_CERT_AUTHORITY_INVALID','ERR_CERT_DATE_INVALID','ERR_SSL_PROTOCOL_ERROR',
                       'ERR_BAD_SSL_CLIENT_AUTH_CERT','ERR_CERT_COMMON_NAME_INVALID'];

  if (DNS_ERRORS.includes(errorCode)) {
    headlineEl.textContent = "Can't find that one.";
    subtitleEl.textContent = "Privoo couldn't find this address. Double-check the URL, or the site might not exist.";
  } else if (CONN_ERRORS.includes(errorCode)) {
    headlineEl.textContent = 'Nothing picked up the signal.';
    subtitleEl.textContent = "The site isn't responding. It could be down, or your connection might be having a moment.";
  } else if (SSL_ERRORS.includes(errorCode)) {
    headlineEl.textContent = "Couldn't make a secure connection.";
    subtitleEl.textContent = "There's a problem with this site's security certificate. Privoo blocked the connection to keep you safe.";
  } else {
    headlineEl.textContent = 'Nothing here to find.';
    subtitleEl.textContent = "Privoo couldn't load this page. The site might be down, the address might be wrong, or there's no internet connection.";
  }

  if (failedUrl) {
    urlChip.textContent = failedUrl;
    urlChip.style.display = '';
  } else {
    urlChip.style.display = 'none';
  }

  if (errorCode) {
    errorCodeEl.textContent = errorCode;
  } else {
    errorCodeEl.style.display = 'none';
  }

  // Dark mode + accent
  // Mirrors applyAccentTriad() in renderer.js, so this page shows the same
// accent as the browser around it. Two rules it has to honour:
//   - '#ffffff' is the adaptive "Mono" accent, not literally white: it means
//     white on the dark UI and near-black on the light one. Written through
//     unmapped it painted white on white in light mode.
//   - --on-accent comes from the accent's own luminance, so a toggle knob or
//     button label on top of it always contrasts with it.
function applyAccent(hex){
  const r = document.documentElement;
  const isDark = document.body.classList.contains('dark') || document.documentElement.classList.contains('dark');
  let c = (hex && /^#[0-9a-f]{6}$/i.test(hex)) ? hex : (isDark ? '#ffffff' : '#101014');
  if (c.toLowerCase() === '#ffffff' && !isDark) c = '#101014';
  r.style.setProperty('--accent', c);
  const [rv, g, b] = c.replace('#','').match(/.{2}/g).map(x => parseInt(x, 16));
  const lum = (0.2126*rv + 0.7152*g + 0.0722*b) / 255;
  // A near-white accent has no headroom to brighten into, so hover darkens.
  const mix = lum > 0.72 ? 0 : 255, k = lum > 0.72 ? 0.12 : 0.18;
  r.style.setProperty('--accent-hover',
    `rgb(${Math.round(rv+(mix-rv)*k)},${Math.round(g+(mix-g)*k)},${Math.round(b+(mix-b)*k)})`);
  r.style.setProperty('--on-accent', lum > 0.6 ? '#1b1b1e' : '#ffffff');
  r.style.setProperty('--accent-soft', `rgba(${rv},${g},${b},${isDark ? '.16' : '.13'})`);
}
  api?.getSettings?.().then(d => {
    document.body.classList.toggle('dark', !!d?.settings?.darkMode);
    applyAccent(d?.settings?.accentColor);
  }).catch(() => {});
  api?.onSettingsChanged?.(s => {
    document.body.classList.toggle('dark', !!s?.darkMode);
    applyAccent(s?.accentColor);
  });

  document.getElementById('retry-btn').addEventListener('click', () => {
    if (failedUrl && api?.navigate) api.navigate(failedUrl);
    else history.go(0);
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else if (api?.navigate) api.navigate('privoo://newtab/');
  });
})();
</script>
</body>
</html>
