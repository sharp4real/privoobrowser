<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>New Incognito Tab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23948ef2' d='M12 2 4 5v6c0 5 3.4 9.4 8 10.6 4.6-1.2 8-5.6 8-10.6V5l-8-3z'/%3E%3Cpath fill='%23fff' d='M10.6 15.4 7.4 12.2l1.3-1.3 1.9 1.9 4-4 1.3 1.3z'/%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
:root{
  --accent:#948ef2;
  --bg:#0a0a0d; --text:#f1f1f4; --muted:#87878f; --border:rgba(255,255,255,.08);
}
html,body{height:100%;overflow:hidden;user-select:none}
body{
  background:var(--bg);color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
body.transparent{background:transparent;}

.wrap{width:100%;max-width:420px;padding:40px 28px;text-align:center;}

.icon{
  width:40px;height:40px;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
}
.icon svg{width:100%;height:100%;fill:currentColor;}

h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px;color:var(--text);}
.lead{font-size:13px;line-height:1.6;color:var(--muted);max-width:340px;margin:0 auto 28px;}

/* Plain list — no card boxes, just icon + text rows separated by hairlines. */
.facts{
  text-align:left;
  border-top:1px solid var(--border);
  margin-bottom:28px;
}
.fact{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 2px;
  border-bottom:1px solid var(--border);
}
.fact svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;fill:var(--muted);}
.fact.on svg{fill:var(--accent);}
.fact p{font-size:12.5px;line-height:1.55;color:var(--muted);}
.fact b{color:var(--text);font-weight:500;}

.search{
  display:flex;align-items:center;gap:10px;
  height:44px;padding:0 14px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:text;
  transition:border-color .14s ease, background .14s ease;
}
.search:hover{background:rgba(255,255,255,.08);}
.search:focus-within{border-color:var(--accent);background:rgba(255,255,255,.08);}
.search svg{width:16px;height:16px;fill:var(--muted);flex-shrink:0;}
.search input{
  flex:1;border:none;outline:none;background:transparent;
  font-size:13.5px;color:var(--text);user-select:text;
}
.search input::placeholder{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C7.59 2 4 5.59 4 10v11l3.5-3.5 3.5 3.5 3.5-3.5 3.5 3.5V10c0-4.41-3.59-8-8-8zm0 2c3.31 0 6 2.69 6 6v8.09l-1.5-1.5-3.5 3.5-3.5-3.5L8 18.09V10c0-3.31 2.69-6 4-6zm-2 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm4 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
    </svg>
  </div>

  <h1>You're browsing privately</h1>
  <p class="lead">Privoo won't save your history, cookies, or form data once you close this window.</p>

  <div class="facts">
    <div class="fact on">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 14l-3-3 1.41-1.41L11 12.17l5.59-5.58L18 8l-7 7z"/></svg>
      <p><b>Cleared on close</b> — history, cookies, site data and anything typed in forms.</p>
    </div>
    <div class="fact">
      <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      <p><b>Still visible</b> to the sites you visit, your network, and your employer or school.</p>
    </div>
  </div>

  <form class="search" id="search-form">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search privately or enter a url"/>
  </form>
</div>

<script>
(function(){
  const api = window.privooInternal;
  let engineUrl = 'https://duckduckgo.com/?q=';
  const ENGINES = {
    google:'https://www.google.com/search?q=',
    bing:'https://www.bing.com/search?q=',
    duckduckgo:'https://duckduckgo.com/?q=',
    brave:'https://search.brave.com/search?q=',
  };
  api?.getSettings?.().then(d => {
    const s = d?.settings || {};
    const e = s.searchEngine;
    if (e && ENGINES[e]) engineUrl = ENGINES[e];
    if (e === 'custom' && s.customSearchUrl) engineUrl = s.customSearchUrl;
    if (s.increaseTransparency) document.body.classList.add('transparent');
  }).catch(()=>{});

  function toUrl(t){
    t = t.trim();
    if (!t) return '';
    if (/^https?:\/\//i.test(t)) return t;
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(t) && !/\s/.test(t)) return 'https://' + t;
    return engineUrl.includes('%s')
      ? engineUrl.replace(/%s/g, encodeURIComponent(t))
      : engineUrl + encodeURIComponent(t);
  }

  document.getElementById('search-form').addEventListener('submit', e => {
    e.preventDefault();
    const url = toUrl(document.getElementById('q').value);
    if (url && api?.navigate) api.navigate(url);
  });
  document.getElementById('q').focus();
})();
</script>
</body>
</html>
