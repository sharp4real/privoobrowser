<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Incognito</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a78bfa' d='M12 2 4 5v6c0 5 3.4 9.4 8 10.6 4.6-1.2 8-5.6 8-10.6V5l-8-3z'/%3E%3Cpath fill='%23fff' d='M10.6 15.4 7.4 12.2l1.3-1.3 1.9 1.9 4-4 1.3 1.3z'/%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
:root{
  --accent:#a78bfa;
  --bg:#170f28; --text:#f1eefc; --muted:#a89bd4; --border:rgba(167,139,250,.18);
}
html,body{height:100%;overflow:hidden;user-select:none}
body{
  background:
    linear-gradient(180deg, rgba(23,15,40,.80), rgba(14,9,26,.88)),
    url("incognitowallpaper.png") center/cover no-repeat,
    var(--bg);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
body.transparent{background:transparent;}

.wrap{width:100%;max-width:420px;padding:40px 28px;text-align:center;}

/* Clean fade + rise entrance — respects reduced-motion. */
@keyframes wrap-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.wrap{animation:wrap-in .45s cubic-bezier(.22,1,.36,1) both;}
@media (prefers-reduced-motion: reduce){.wrap{animation:none;}}

.logo{
  width:44px;height:44px;margin:0 auto 18px;
  display:block;object-fit:contain;
  filter:drop-shadow(0 4px 16px rgba(167,139,250,.35));
}

h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px;color:var(--text);}
.lead{font-size:13px;line-height:1.6;color:var(--muted);max-width:340px;margin:0 auto 32px;}
.lead b{color:var(--text);font-weight:600;}

/* ── First-run welcome ── */
#welcome-view .logo{width:56px;height:56px;margin-bottom:22px;}
#welcome-view h1{font-size:22px;margin-bottom:12px;}
#welcome-view .lead{max-width:360px;margin-bottom:30px;}
.got-it{
  height:42px;padding:0 26px;border-radius:999px;border:none;
  background:var(--accent);color:#170f28;font-size:13.5px;font-weight:650;
  cursor:default;font-family:inherit;
  box-shadow:0 6px 20px -6px rgba(167,139,250,.5);
  transition:filter .12s ease, transform .12s ease;
}
.got-it:hover{filter:brightness(1.06);transform:translateY(-1px);}

.search{
  display:flex;align-items:center;gap:10px;
  height:44px;padding:0 14px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:text;
  transition:border-color .14s ease, background .14s ease;
}
.search:hover{background:rgba(255,255,255,.08);}
.search:focus-within{border-color:var(--accent);background:rgba(255,255,255,.08);}
.search svg{width:16px;height:16px;fill:var(--muted);flex-shrink:0;}
.search input{
  flex:1;border:none;outline:none;background:transparent;
  font-size:13.5px;color:var(--text);user-select:text;
}
.search input::placeholder{color:var(--muted);}

.vpn-nudge{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;margin-top:14px;padding:10px 14px;border-radius:999px;
  background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.22);
  color:var(--accent);font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:default;transition:background .14s ease,border-color .14s ease;
}
.vpn-nudge:hover{background:rgba(167,139,250,.18);border-color:rgba(167,139,250,.32);}
.vpn-nudge svg{width:15px;height:15px;fill:currentColor;flex-shrink:0;}
</style>
</head>
<body>
<!-- First-run only: shown once, then never again (Settings-tracked). -->
<div class="wrap" id="welcome-view" hidden>
  <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'"/>
  <h1>Welcome to Incognito</h1>
  <p class="lead">Your secrets are safe here. Privoo won't save your history, cookies, or anything you type in this window once you close it.</p>
  <button type="button" class="got-it" id="welcome-got-it">Got it</button>
</div>

<div class="wrap" id="main-view">
  <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'"/>

  <h1>Your secrets are safe here.</h1>
  <p class="lead"><b>Cleared on close</b> — history, cookies and form data. Still visible to sites you visit and your network.</p>

  <form class="search" id="search-form">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search privately or enter a url"/>
  </form>

  <button type="button" class="vpn-nudge" id="vpn-nudge">
    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zM9 7a3 3 0 0 1 6 0v3H9V7zm3 6.5a1.5 1.5 0 0 1 1 2.6V18h-2v-1.9a1.5 1.5 0 0 1 1-2.6z"/></svg>
    <span>For more anonymity, turn on Privoo VPN</span>
  </button>
</div>

<script>
(function(){
  const api = window.privooInternal;
  let engineUrl = 'https://duckduckgo.com/?q=';
  const ENGINES = {
    google:'https://www.google.com/search?q=',
    bing:'https://www.bing.com/search?q=',
    duckduckgo:'https://duckduckgo.com/?q=',
    brave:'https://search.brave.com/search?q=',
  };
  const welcomeView = document.getElementById('welcome-view');
  const mainView = document.getElementById('main-view');

  api?.getSettings?.().then(d => {
    const s = d?.settings || {};
    const e = s.searchEngine;
    if (e && ENGINES[e]) engineUrl = ENGINES[e];
    if (e === 'custom' && s.customSearchUrl) engineUrl = s.customSearchUrl;
    if (s.increaseTransparency) document.body.classList.add('transparent');

    if (!s.incognitoWelcomeShown) {
      mainView.hidden = true;
      welcomeView.hidden = false;
    } else {
      document.getElementById('q').focus();
    }
  }).catch(()=>{
    document.getElementById('q').focus();
  });

  document.getElementById('welcome-got-it').addEventListener('click', () => {
    api?.setSettings?.({ incognitoWelcomeShown: true }).catch(()=>{});
    welcomeView.hidden = true;
    mainView.hidden = false;
    document.getElementById('q').focus();
  });

  function toUrl(t){
    t = t.trim();
    if (!t) return '';
    if (/^https?:\/\//i.test(t)) return t;
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(t) && !/\s/.test(t)) return 'https://' + t;
    return engineUrl.includes('%s')
      ? engineUrl.replace(/%s/g, encodeURIComponent(t))
      : engineUrl + encodeURIComponent(t);
  }

  document.getElementById('search-form').addEventListener('submit', e => {
    e.preventDefault();
    const url = toUrl(document.getElementById('q').value);
    if (url && api?.navigate) api.navigate(url);
  });

  document.getElementById('vpn-nudge').addEventListener('click', () => {
    api?.openVpnPanel?.();
  });
})();
</script>
</body>
</html>
