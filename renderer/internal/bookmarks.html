<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Bookmarks - Privoo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%238b7cf7' d='M12 2 4 5v6c0 5 3.4 9.4 8 10.6 4.6-1.2 8-5.6 8-10.6V5l-8-3z'/%3E%3Cpath fill='%23fff' d='M10.6 15.4 7.4 12.2l1.3-1.3 1.9 1.9 4-4 1.3 1.3z'/%3E%3C/svg%3E"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
html{height:100%;background:transparent}
body{height:100%;background:#f8f9fa;color:#1f1f1f;user-select:none;display:flex;flex-direction:column}
body.dark{background:#1e1e21;color:#ededf0;color-scheme:dark}
/* ── Privoo studio palette ── */
body{background:#f3f3f7 !important;color:#17171f}
body.dark{background:#1e1e21 !important;color:#ededf0}
header{background:#ffffff !important;border-bottom-color:rgba(23,23,31,.09) !important}
body.dark header{background:#1e1e21 !important;border-bottom-color:rgba(255,255,255,.08) !important}
.bm-card{background:#ffffff !important;border-color:rgba(23,23,31,.09) !important}
body.dark .bm-card{background:#28282c !important;border-color:rgba(255,255,255,.08) !important}
button,input{font:inherit}
button{cursor:default;border:none;background:transparent;color:inherit}

header{
  background:#fff;border-bottom:1px solid #d8d8de;
  padding:16px 28px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:10;flex-shrink:0;flex-wrap:wrap
}
body.dark header{background:#37373f;border-color:#43434c}
h1{font-size:20px;font-weight:500;margin-right:auto}
#search{
  border:1px solid #dfe1e5;border-radius:10px;
  padding:0 14px;font-size:13.5px;outline:none;background:#f8f9fa;
  width:260px;height:34px;user-select:text
}
#search:focus{border-color:#3c4043;background:#fff}
body.dark #search{background:#1e1e21;border-color:#4d4d57;color:#ededf0}
.toolbar-btn{
  height:32px;padding:0 14px;border-radius:10px;border:1px solid #d8d8de;
  font-size:13px;color:#1f1f1f;background:#fff
}
.toolbar-btn:hover{background:#f1f3f4}
.toolbar-btn.danger{color:#d93025}
body.dark .toolbar-btn{background:#37373f;border-color:#4d4d57;color:#ededf0}
body.dark .toolbar-btn.danger{color:#f28b82}

main{flex:1;min-height:0;max-width:900px;margin:0 auto;width:100%;padding:20px 20px 32px;overflow-y:auto;background:inherit}
#empty{text-align:center;padding:80px 20px;color:#4d4d57}
body.dark #empty{color:#b0b0b8}
#empty svg{width:64px;height:64px;fill:#d8d8de;margin-bottom:16px}
#empty h2{font-size:18px;font-weight:400;margin-bottom:8px;color:#3c4043}
body.dark #empty svg{fill:#4d4d57}
body.dark #empty h2{color:#ededf0}

#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

.bm-card{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;border-radius:10px;cursor:default;
  border:1px solid #ededf0;background:#fff;
  transition:background .1s,border-color .1s
}
.bm-card:hover{background:#f8f9fa;border-color:#d8d8de}
body.dark .bm-card{background:#37373f;border-color:#43434c}
body.dark .bm-card:hover{background:#3c4043}

.bm-dot{
  width:28px;height:28px;border-radius:12px;
  background:#ededf0;color:#3c4043;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;
  overflow:hidden;position:relative;
}
body.dark .bm-dot{background:#43434c;color:#ededf0}
.bm-dot img{
  width:16px;height:16px;object-fit:contain;
  position:absolute;display:none;
}
.bm-dot.loaded img{display:block}
.bm-dot.loaded .bm-letter{display:none}

.bm-info{flex:1;min-width:0}
.bm-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-url{font-size:11.5px;color:#4d4d57;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
body.dark .bm-url{color:#b0b0b8}

.bm-del{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#b0b0b8;opacity:0;transition:opacity .1s;flex-shrink:0
}
.bm-card:hover .bm-del{opacity:1}
.bm-del:hover{background:rgba(0,0,0,.08);color:#d93025}
body.dark .bm-del:hover{background:rgba(255,255,255,.08);color:#f28b82}
</style>
<!-- Shared finish pass: one palette across every Privoo page. Loads last so
     it wins on order; the block above still owns this page's layout. -->
<link rel="stylesheet" href="page-theme.css" />
</head>
<body>
<header>
  <h1>Bookmarks</h1>
  <input id="search" type="search" placeholder="Search bookmarks…" autocomplete="off"/>
  <button class="toolbar-btn danger" id="btn-clear-all">Clear all</button>
</header>
<main>
  <div id="empty" hidden>
    <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
    <h2>No bookmarks yet</h2>
    <p>Click the star icon in the address bar to save a page.</p>
  </div>
  <div id="list"></div>
</main>
<script>
(function(){
  let bookmarks = [];

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load(){
    const r = await window.privooInternal.getSettings();
    const settings = r?.settings || r;
    bookmarks = Array.isArray(settings?.bookmarks) ? settings.bookmarks : [];
    document.body.classList.toggle('dark', !!settings?.darkMode);
    applyAccent(settings?.accentColor);
    render(bookmarks);
  }

  // Mirrors applyAccentTriad() in renderer.js, so this page shows the same
// accent as the browser around it. Two rules it has to honour:
//   - '#ffffff' is the adaptive "Mono" accent, not literally white: it means
//     white on the dark UI and near-black on the light one. Written through
//     unmapped it painted white on white in light mode.
//   - --on-accent comes from the accent's own luminance, so a toggle knob or
//     button label on top of it always contrasts with it.
function applyAccent(hex){
  const r = document.documentElement;
  const isDark = document.body.classList.contains('dark') || document.documentElement.classList.contains('dark');
  let c = (hex && /^#[0-9a-f]{6}$/i.test(hex)) ? hex : (isDark ? '#ffffff' : '#101014');
  if (c.toLowerCase() === '#ffffff' && !isDark) c = '#101014';
  r.style.setProperty('--accent', c);
  const [rv, g, b] = c.replace('#','').match(/.{2}/g).map(x => parseInt(x, 16));
  const lum = (0.2126*rv + 0.7152*g + 0.0722*b) / 255;
  // A near-white accent has no headroom to brighten into, so hover darkens.
  const mix = lum > 0.72 ? 0 : 255, k = lum > 0.72 ? 0.12 : 0.18;
  r.style.setProperty('--accent-hover',
    `rgb(${Math.round(rv+(mix-rv)*k)},${Math.round(g+(mix-g)*k)},${Math.round(b+(mix-b)*k)})`);
  r.style.setProperty('--on-accent', lum > 0.6 ? '#1b1b1e' : '#ffffff');
  r.style.setProperty('--accent-soft', `rgba(${rv},${g},${b},${isDark ? '.16' : '.13'})`);
}

  function render(list){
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    listEl.innerHTML = '';
    if(!list.length){ emptyEl.hidden=false; return; }
    emptyEl.hidden = true;
    for(const bm of list){
      const card = document.createElement('div');
      card.className = 'bm-card';
      const letter = (bm.name||bm.url||'?')[0].toUpperCase();

      // Favicon dot — shows letter until the favicon loads
      const dot = document.createElement('div');
      dot.className = 'bm-dot';
      dot.innerHTML = `<span class="bm-letter">${esc(letter)}</span>`;
      try {
        const faviconUrl = 'https://www.google.com/s2/favicons?sz=32&domain=' + encodeURIComponent(new URL(bm.url).hostname);
        const img = document.createElement('img');
        img.src = faviconUrl;
        img.alt = '';
        img.addEventListener('load', () => dot.classList.add('loaded'));
        img.addEventListener('error', () => dot.classList.remove('loaded'));
        dot.appendChild(img);
      } catch { /* invalid URL — letter fallback stays */ }

      const info = document.createElement('div');
      info.className = 'bm-info';
      info.innerHTML =
        `<div class="bm-name">${esc(bm.name||bm.url)}</div>`+
        `<div class="bm-url">${esc(bm.url)}</div>`;

      const del = document.createElement('button');
      del.className = 'bm-del';
      del.title = 'Remove bookmark';
      del.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

      card.appendChild(dot);
      card.appendChild(info);
      card.appendChild(del);

      card.addEventListener('click', (e)=>{
        if(e.target.closest('.bm-del')) return;
        window.privooInternal.navigate(bm.url);
      });
      del.addEventListener('click', async (e)=>{
        e.stopPropagation();
        bookmarks = bookmarks.filter(b=>b.url!==bm.url);
        await window.privooInternal.setSettings({ bookmarks });
        render(bookmarks);
      });
      listEl.appendChild(card);
    }
  }

  document.getElementById('search').addEventListener('input', function(){
    const q = this.value.toLowerCase();
    if(!q){ render(bookmarks); return; }
    render(bookmarks.filter(b=>(b.name||'').toLowerCase().includes(q)||(b.url||'').toLowerCase().includes(q)));
  });

  document.getElementById('btn-clear-all').addEventListener('click', async ()=>{
    if(!confirm('Remove all bookmarks?')) return;
    bookmarks = [];
    await window.privooInternal.setSettings({ bookmarks: [] });
    render([]);
  });

  window.privooInternal.onSettingsChanged((data)=>{
    const s = data?.settings || data;
    document.body.classList.toggle('dark', !!s?.darkMode);
    applyAccent(s?.accentColor);
    bookmarks = Array.isArray(s?.bookmarks) ? s.bookmarks : [];
    const q = document.getElementById('search').value.toLowerCase();
    render(q ? bookmarks.filter(b=>(b.name||'').toLowerCase().includes(q)||(b.url||'').toLowerCase().includes(q)) : bookmarks);
  });

  load().catch(console.error);
})();
</script>
</body>
</html>
