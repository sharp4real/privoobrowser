<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Privoo News</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f46e5' d='M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z'/%3E%3C/svg%3E"/>
<style>
/* One sentence and a button. The page used to be a changelog; the releases
   are on GitHub now, so this points at them and gets out of the way. */
*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
html,body{height:100%;background:var(--o-bg,#f2f2f4);color:var(--o-text,#101014);user-select:none;}
.wrap{
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:40px 28px 72px;
}
.mark{
  width:46px;height:46px;margin-bottom:20px;
  display:grid;place-items:center;
  border-radius:14px;
  background:var(--o-surface,#fff);
  border:1px solid var(--o-line,rgba(16,16,20,.1));
  color:var(--o-muted,#64646f);
}
.mark svg{width:23px;height:23px;fill:currentColor}
h1{font-size:24px;font-weight:640;letter-spacing:-.025em;margin-bottom:9px;}
p{font-size:14px;line-height:1.6;color:var(--o-muted,#64646f);max-width:40ch;margin-bottom:24px;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  height:38px;padding:0 18px;
  border-radius:10px;border:1px solid var(--o-line,rgba(16,16,20,.1));
  background:var(--o-surface,#fff);
  color:var(--o-text,#101014);
  font-size:13.5px;font-weight:550;
  text-decoration:none;cursor:pointer;
  transition:border-color .13s ease,box-shadow .13s ease;
}
.btn:hover{
  border-color:var(--o-line-2,rgba(16,16,20,.18));
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px -14px rgba(0,0,0,.5);
}
.btn svg{width:16px;height:16px;fill:currentColor}
.ver{margin-top:20px;font-size:12px;color:var(--o-faint,#9a9aa6);}
</style>
<!-- Shared finish pass: one palette across every Privoo page. -->
<link rel="stylesheet" href="page-theme.css"/>
</head>
<body>
<main class="wrap">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></svg>
  </div>
  <h1>Privoo News</h1>
  <p>Everything about each release lives on GitHub, alongside the source it describes.</p>
  <a class="btn" id="gh" href="https://github.com/sharp4real/privoobrowser/releases">
    <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 8.84 21.5c.5.09.68-.22.68-.48v-1.7C6.73 19.91 6.14 18 6.14 18c-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.94.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
    Open the releases on GitHub
  </a>
  <div class="ver" id="ver"></div>
</main>
<script>
(function () {
  var api = window.privooInternal;

  // Dark mode, the same way every other internal page does it.
  function apply(s) {
    var dark = !!(s && s.darkMode);
    document.body.classList.toggle('dark', dark);
    document.documentElement.classList.toggle('dark', dark);
  }
  if (api && api.getSettings) {
    api.getSettings().then(function (d) { apply((d && d.settings) || d); }).catch(function () {});
  }
  if (api && api.onSettingsChanged) {
    api.onSettingsChanged(function (s) { apply((s && s.settings) || s); });
  }

  // Which build this is. Not a claim about what changed in it — just the
  // number you would want when reading a release note.
  if (api && api.getAppVersion) {
    api.getAppVersion().then(function (v) {
      if (v) document.getElementById('ver').textContent = 'You are on ' + v;
    }).catch(function () {});
  }

  // An <a> inside a guest navigates the guest, which would leave Privoo's own
  // page sitting on github.com. Hand it to the host as a new tab instead.
  var gh = document.getElementById('gh');
  if (gh && api && api.openTab) {
    gh.addEventListener('click', function (e) {
      e.preventDefault();
      api.openTab(gh.href);
    });
  }
})();
</script>
</body>
</html>
