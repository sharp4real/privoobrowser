<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
<title>Privoo Profiles</title>
<style>
  :root {
    --bg: #16161c;
    --bg2: #1d1d26;
    --card: #23232e;
    --card-hover: #2b2b38;
    --text: #f2f2f5;
    --muted: rgba(255,255,255,0.5);
    --faint: rgba(255,255,255,0.32);
    --line: rgba(255,255,255,0.08);
    /* Overridden at runtime with the user's accent colour. */
    --accent: #8ab4f8;
    --accent-hover: #6fa0f0;
    --accent-soft: rgba(138,180,248,0.16);
    --danger: #e0556b;
  }
  * { box-sizing: border-box; }
  /* Form controls don't inherit font-family by default — force it so buttons
     (Browse as Guest, etc.) and inputs match the rest of the window. */
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    /* Matches the browser chrome's font stack (Segoe UI first on Windows). */
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  body {
    background:
      radial-gradient(1100px 420px at 50% -8%, var(--accent-soft), transparent 62%),
      var(--bg);
    display: flex; flex-direction: column;
  }

  /* Drag bar */
  #titlebar {
    height: 38px; flex-shrink: 0;
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 8px;
  }
  #close-btn {
    -webkit-app-region: no-drag;
    width: 30px; height: 30px; border-radius: 8px; border: none;
    background: transparent; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  #close-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 40px 0;
    overflow: hidden;
  }
  .logo {
    width: 46px; height: 46px; border-radius: 12px; object-fit: contain;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .subtitle {
    font-size: 13.5px; color: var(--muted); margin: 0 0 26px;
  }

  /* Profile grid */
  .grid {
    display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
    width: 100%; max-width: 600px;
    overflow-y: auto; padding: 6px;
    max-height: 320px;
  }
  .grid::-webkit-scrollbar { width: 8px; }
  .grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

  .card {
    position: relative;
    width: 168px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 16px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    cursor: pointer;
    transition: background .14s, transform .12s, border-color .14s, box-shadow .14s;
  }
  .card:hover {
    background: var(--card-hover);
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 14px 34px rgba(0,0,0,0.38);
  }
  .card.add {
    justify-content: center;
    border-color: var(--line);
    background: var(--card);
    min-height: 172px;
  }
  .card.add:hover { background: var(--card-hover); }
  .card.add .card-name { color: var(--muted); }

  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #fff;
    overflow: hidden; flex-shrink: 0; position: relative;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .card-name {
    font-size: 15px; font-weight: 600;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-default-tag {
    font-size: 10px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .06em; margin-top: -8px;
  }
  .card-edit {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border-radius: 8px; border: none;
    background: rgba(0,0,0,0.32); color: rgba(255,255,255,0.7); cursor: pointer;
    display: none; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .card:hover .card-edit { display: flex; }
  .card-edit:hover { background: rgba(0,0,0,0.55); color: #fff; }

  .add-circle {
    width: 92px; height: 92px; border-radius: 50%;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    transition: background .14s, color .14s;
  }
  .card.add:hover .add-circle { background: var(--accent); color: #16161c; }

  /* Footer */
  footer {
    flex-shrink: 0;
    width: 100%; max-width: 560px;
    padding: 16px 0 22px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    color: var(--faint); font-size: 12px;
  }
  .guest-btn {
    -webkit-app-region: no-drag;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 22px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .14s, border-color .14s, transform .1s;
  }
  .guest-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
  .guest-btn:active { transform: scale(.97); }
  .switch {
    -webkit-app-region: no-drag;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    color: var(--muted);
  }
  .switch input { display: none; }
  .switch .track {
    width: 34px; height: 20px; border-radius: 12px;
    background: rgba(255,255,255,0.16); position: relative; transition: background .15s;
    flex-shrink: 0;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }

  /* Modal */
  .backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: no-drag;
  }
  .modal {
    width: 360px;
    background: linear-gradient(180deg, var(--bg2), var(--bg));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 30px 28px 24px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.65);
    animation: modal-in .18s cubic-bezier(.2,.8,.25,1.05);
  }
  @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  .modal h2 { font-size: 19px; margin: 0 0 4px; font-weight: 700; letter-spacing: -.01em; text-align: center; }
  .modal-sub { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0 0 22px; }
  .modal-avatar-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px;
  }
  .modal-avatar {
    width: 104px; height: 104px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 700; color: #fff;
    overflow: hidden; position: relative;
    box-shadow: 0 0 0 4px var(--accent-soft), 0 6px 18px rgba(0,0,0,0.3);
    transition: box-shadow .15s, transform .12s;
  }
  .modal-avatar:hover { transform: scale(1.03); box-shadow: 0 0 0 5px var(--accent-soft), 0 8px 22px rgba(0,0,0,0.35); }
  .modal-avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .modal-avatar .cam {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .14s; border-radius: 50%; color: #fff;
    font-size: 9px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  }
  .modal-avatar:hover .cam { opacity: 1; }
  .modal-avatar-hint { font-size: 11.5px; color: var(--faint); }
  .field-label {
    display: block; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px;
  }
  .field-input {
    width: 100%; padding: 12px 14px; border-radius: 11px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05); color: var(--text);
    font-size: 14px; outline: none; transition: border-color .14s, background .14s;
  }
  .field-input::placeholder { color: rgba(255,255,255,0.3); }
  .field-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.07); }
  .modal-btns { display: flex; gap: 10px; margin-top: 26px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 11px; font-size: 13.5px; cursor: pointer;
    border: 1.5px solid transparent; font-weight: 600; transition: background .12s, border-color .12s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: transparent; border-color: rgba(255,255,255,0.14); color: var(--muted); }
  .btn.secondary:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .btn.primary { background: var(--accent); color: #0c0c12; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger { background: #d93025; color: #fff; }
  .btn.danger:hover { background: #e0463b; }
  .btn.danger-link {
    width: 100%; margin-top: 12px; padding: 10px; background: transparent;
    border-color: rgba(224,85,107,0.32); color: var(--danger); flex: none; font-size: 12.5px;
  }
  .btn.danger-link:hover { background: rgba(224,85,107,0.12); }

  /* Photo cropper */
  .crop-stage {
    width: 250px; height: 250px; margin: 4px auto 18px;
    position: relative; overflow: hidden; border-radius: 16px;
    background: #000; cursor: grab; touch-action: none;
  }
  .crop-stage:active { cursor: grabbing; }
  .crop-img {
    position: absolute; top: 0; left: 0; max-width: none;
    user-select: none; -webkit-user-drag: none; will-change: transform;
  }
  .crop-ring {
    position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 250px rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.85);
  }
  .crop-zoom {
    -webkit-appearance: none; width: 100%; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,0.16); outline: none; margin: 2px 0 4px;
    accent-color: var(--accent);
  }
  .crop-zoom::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .crop-hint {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11.5px; color: var(--faint); margin-bottom: 2px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="titlebar">
    <button id="close-btn" title="Close">
      <svg viewBox="0 0 12 12" width="11" height="11"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <main>
    <img class="logo" src="../../logo.png" alt="" onerror="this.style.display='none'" />
    <h1>Who's using Privoo?</h1>
    <p class="subtitle">Pick a profile to continue. Each keeps its own history, logins, and settings.</p>

    <div class="grid" id="grid"></div>

    <footer>
      <button id="guest-btn" class="guest-btn" title="Open a private window — no history or cookies are kept">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-8 0 4 4 0 0 1 4-4zm0 10c3.31 0 8 1.34 8 4v2H4v-2c0-2.66 4.69-4 8-4zm6.5-7.5c.83 0 1.5.67 1.5 1.5h-2.06c.02-.16.06-.33.06-.5 0-.35-.07-.68-.18-1H18.5zM6.18 6.5c-.11.32-.18.65-.18 1 0 .17.04.34.06.5H4c0-.83.67-1.5 1.5-1.5h.68z"/><circle cx="9" cy="8" r="1.2" fill="#16161c"/><circle cx="15" cy="8" r="1.2" fill="#16161c"/></svg>
        Browse as Guest
      </button>
      <label class="switch">
        <input type="checkbox" id="always-ask" />
        <span class="track"></span>
        <span>Always ask which profile to use on startup</span>
      </label>
    </footer>
  </main>

  <div class="backdrop hidden" id="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title">Create profile</h2>
      <p class="modal-sub" id="modal-sub">Give it a name and an optional photo.</p>
      <div class="modal-avatar-wrap">
        <div class="modal-avatar" id="modal-avatar">
          <span id="modal-initials">N</span>
          <img id="modal-img" class="hidden" alt="" />
          <span class="cam">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M9 3l-1.83 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
            <span>Change</span>
          </span>
        </div>
        <div class="modal-avatar-hint">Click to choose a photo</div>
        <input type="file" id="modal-file" accept="image/*" class="hidden" />
      </div>
      <label class="field-label" for="modal-name">Profile name</label>
      <input type="text" id="modal-name" class="field-input" placeholder="e.g. Work, Personal, School" maxlength="40" />
      <div class="modal-btns">
        <button class="btn secondary" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-save">Create</button>
      </div>
      <button class="btn danger-link hidden" id="modal-delete">Delete this profile</button>
    </div>
  </div>

<script>
(function () {
  const PALETTE = ['#e05c8a','#28b67a','#e08c2c','#9b59b6','#e74c3c','#1abc9c','#f39c12','#5b7fff'];
  let _accent = '#8ab4f8';
  // The built-in "Default" profile's avatar follows the user's accent colour;
  // every other profile gets a stable, distinct palette colour so they're
  // easy to tell apart at a glance.
  function colorFor(id) {
    if (id === 'default') return _accent;
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  // Lighten/darken a hex colour for accent hover + soft tints.
  function shade(hex, amt) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const r = Math.max(0, Math.min(255, (n >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt));
    const b = Math.max(0, Math.min(255, (n & 0xff) + amt));
    return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
  }
  function rgba(hex, a) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    return `rgba(${n >> 16},${(n >> 8) & 0xff},${n & 0xff},${a})`;
  }
  function applyAccent(hex) {
    _accent = hex || '#8ab4f8';
    const root = document.documentElement.style;
    root.setProperty('--accent', _accent);
    root.setProperty('--accent-hover', shade(_accent, -18));
    root.setProperty('--accent-soft', rgba(_accent, 0.18));
  }

  // Mirror the browser's interface-font choices so the picker matches whatever
  // font the user picked in Settings → Appearance.
  const UI_FONTS = {
    system:   '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif',
    rounded:  '"Segoe UI Variable Display", "SF Pro Rounded", "Nunito", "Quicksand", system-ui, sans-serif',
    classic:  'Georgia, "Times New Roman", "Iowan Old Style", serif',
    grotesk:  '"Inter", "Helvetica Neue", "Arial Nova", Helvetica, Arial, sans-serif',
    mono:     'ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace',
    dyslexic: '"Comic Sans MS", "Comic Neue", "Trebuchet MS", system-ui, sans-serif',
  };
  function applyFont(key) {
    document.body.style.fontFamily = UI_FONTS[key] || UI_FONTS.system;
  }
  function initials(name) {
    const parts = (name || 'P').trim().split(/\s+/);
    return (parts.length > 1
      ? parts[0][0] + parts[parts.length - 1][0]
      : (name || 'P')[0]).toUpperCase();
  }

  const grid       = document.getElementById('grid');
  const alwaysAsk  = document.getElementById('always-ask');
  let _profiles = [];
  let _prefs = {};

  // ── Render the grid ───────────────────────────────────────────────────────
  function render() {
    grid.innerHTML = '';
    for (const p of _profiles) {
      const card = document.createElement('div');
      card.className = 'card';

      const av = document.createElement('div');
      av.className = 'avatar';
      av.style.background = colorFor(p.id);
      if (p.avatar) {
        const img = document.createElement('img');
        img.src = p.avatar; img.alt = '';
        av.appendChild(img);
      } else {
        av.textContent = initials(p.name);
      }

      const name = document.createElement('div');
      name.className = 'card-name';
      name.textContent = p.name;

      card.appendChild(av);
      card.appendChild(name);

      if (_prefs.defaultProfileId === p.id) {
        const tag = document.createElement('div');
        tag.className = 'card-default-tag';
        tag.textContent = 'Default';
        card.appendChild(tag);
      }

      const edit = document.createElement('button');
      edit.className = 'card-edit';
      edit.title = 'Edit profile';
      edit.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
      edit.addEventListener('click', (e) => { e.stopPropagation(); openModal(p); });
      card.appendChild(edit);

      card.addEventListener('click', () => choose(p.id));
      grid.appendChild(card);
    }

    // Add-profile card
    const add = document.createElement('div');
    add.className = 'card add';
    add.innerHTML =
      '<div class="add-circle"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>' +
      '<div class="card-name">Add profile</div>';
    add.addEventListener('click', () => openModal(null));
    grid.appendChild(add);
  }

  function choose(id) {
    // When the user clicks a profile, that becomes the default *only* if they
    // haven't asked to always be prompted. This mirrors Chrome: a single
    // profile click sets the smooth path for next time.
    const makeDefault = !alwaysAsk.checked;
    window.picker.choose(id, makeDefault);
  }

  // ── Create / edit modal ───────────────────────────────────────────────────
  const backdrop  = document.getElementById('modal-backdrop');
  const mTitle    = document.getElementById('modal-title');
  const mAvatar   = document.getElementById('modal-avatar');
  const mInitials = document.getElementById('modal-initials');
  const mImg      = document.getElementById('modal-img');
  const mFile     = document.getElementById('modal-file');
  const mName     = document.getElementById('modal-name');
  const mSave     = document.getElementById('modal-save');
  const mCancel   = document.getElementById('modal-cancel');
  const mDelete   = document.getElementById('modal-delete');

  let editing = null;       // null = create, else profile object
  let pendingAvatar = '';

  function openModal(profile) {
    editing = profile;
    pendingAvatar = profile ? (profile.avatar || '') : '';
    mTitle.textContent = profile ? 'Edit profile' : 'Create profile';
    document.getElementById('modal-sub').textContent = profile
      ? 'Update the name or photo for this profile.'
      : 'Give it a name and an optional photo.';
    mSave.textContent  = profile ? 'Save' : 'Create';
    mName.value = profile ? profile.name : '';
    const seedId = profile ? profile.id : 'new' + Date.now();
    mAvatar.style.background = colorFor(seedId);
    if (pendingAvatar) {
      mImg.src = pendingAvatar; mImg.classList.remove('hidden'); mInitials.classList.add('hidden');
    } else {
      mImg.classList.add('hidden'); mInitials.classList.remove('hidden');
      mInitials.textContent = initials(profile ? profile.name : 'New');
    }
    // Delete only for real, non-default profiles.
    mDelete.classList.toggle('hidden', !profile || profile.id === 'default');
    backdrop.classList.remove('hidden');
    setTimeout(() => mName.focus(), 40);
  }
  function closeModal() { backdrop.classList.add('hidden'); }

  mName.addEventListener('input', () => {
    if (!pendingAvatar) mInitials.textContent = initials(mName.value || 'New');
  });
  mAvatar.addEventListener('click', () => mFile.click());
  mFile.addEventListener('change', () => {
    const f = mFile.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = async (ev) => {
      const cropped = await openCropper(ev.target.result);
      if (cropped) {
        pendingAvatar = cropped;
        mImg.src = pendingAvatar; mImg.classList.remove('hidden'); mInitials.classList.add('hidden');
      }
    };
    r.readAsDataURL(f);
    mFile.value = '';
  });
  mCancel.addEventListener('click', closeModal);
  backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) closeModal(); });
  mName.addEventListener('keydown', (e) => { if (e.key === 'Enter') mSave.click(); });

  mSave.addEventListener('click', async () => {
    const name = mName.value.trim();
    if (!name) { mName.focus(); return; }
    if (editing) {
      await window.picker.update({ id: editing.id, name, avatar: pendingAvatar });
    } else {
      await window.picker.create({ name, avatar: pendingAvatar });
    }
    closeModal();
    await load();
  });

  mDelete.addEventListener('click', async () => {
    if (!editing) return;
    const ok = await showConfirm({
      title: 'Delete profile?',
      message: '"' + editing.name + '" and all its history, logins and settings will be permanently erased.',
      confirmLabel: 'Delete',
    });
    if (!ok) return;
    await window.picker.remove(editing.id);
    closeModal();
    await load();
  });

  // ── Prefs ─────────────────────────────────────────────────────────────────
  alwaysAsk.addEventListener('change', () => {
    window.picker.setPrefs({ alwaysShowPicker: alwaysAsk.checked });
    // If the user wants to always be asked, clear any pinned default.
    if (alwaysAsk.checked) {
      window.picker.setPrefs({ defaultProfileId: null });
      _prefs.defaultProfileId = null;
      render();
    }
  });

  document.getElementById('close-btn').addEventListener('click', () => window.picker.close());
  document.getElementById('guest-btn').addEventListener('click', () => window.picker.incognito());

  // Styled confirmation dialog (replaces the native confirm()).
  function showConfirm({ title, message, confirmLabel }) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'backdrop'; back.style.zIndex = '70';
      back.innerHTML =
        '<div class="modal" style="width:320px;">' +
          '<h2 style="text-align:left;margin-bottom:8px;">' + title + '</h2>' +
          '<p class="modal-sub" style="text-align:left;margin-bottom:20px;">' + message + '</p>' +
          '<div class="modal-btns">' +
            '<button class="btn secondary" id="_cfno">Cancel</button>' +
            '<button class="btn danger" id="_cfyes">' + (confirmLabel || 'Confirm') + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(back);
      const done = (v) => { back.remove(); resolve(v); };
      back.querySelector('#_cfno').addEventListener('click', () => done(false));
      back.querySelector('#_cfyes').addEventListener('click', () => done(true));
      back.addEventListener('mousedown', (e) => { if (e.target === back) done(false); });
    });
  }

  // ── Photo cropper (drag to reposition, scroll / slider to zoom) ───────────
  function openCropper(src) {
    return new Promise((resolve) => {
      const back = document.createElement('div');
      back.className = 'backdrop';
      back.style.zIndex = '60';
      back.innerHTML =
        '<div class="modal" style="width:330px;">' +
          '<h2>Adjust photo</h2>' +
          '<p class="modal-sub">Drag to reposition · scroll or use the slider to zoom</p>' +
          '<div class="crop-stage" id="crop-stage">' +
            '<img class="crop-img" id="crop-img" alt="" draggable="false" />' +
            '<div class="crop-ring"></div>' +
          '</div>' +
          '<input type="range" id="crop-zoom" class="crop-zoom" min="1" max="3" step="0.01" value="1" />' +
          '<div class="modal-btns">' +
            '<button class="btn secondary" id="crop-cancel">Cancel</button>' +
            '<button class="btn primary" id="crop-apply">Apply</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(back);

      const stage = back.querySelector('#crop-stage');
      const img   = back.querySelector('#crop-img');
      const zoom  = back.querySelector('#crop-zoom');
      const V = 250;                 // viewport size (matches .crop-stage)
      let iw = 0, ih = 0, base = 1, scale = 1, ox = 0, oy = 0, drag = null;

      function clamp() {
        const minx = V - iw * scale, miny = V - ih * scale;
        ox = Math.min(0, Math.max(minx, ox));
        oy = Math.min(0, Math.max(miny, oy));
      }
      function layout() {
        clamp();
        img.style.width  = (iw * scale) + 'px';
        img.style.height = (ih * scale) + 'px';
        img.style.transform = `translate(${ox}px,${oy}px)`;
      }
      img.onload = () => {
        iw = img.naturalWidth; ih = img.naturalHeight;
        base = Math.max(V / iw, V / ih);
        scale = base;
        ox = (V - iw * scale) / 2; oy = (V - ih * scale) / 2;
        layout();
      };
      img.src = src;

      zoom.addEventListener('input', () => {
        // Keep the viewport centre anchored while zooming.
        const cx = V / 2, cy = V / 2;
        const px = (cx - ox) / scale, py = (cy - oy) / scale;
        scale = base * parseFloat(zoom.value);
        ox = cx - px * scale; oy = cy - py * scale;
        layout();
      });
      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        let z = parseFloat(zoom.value) + (e.deltaY < 0 ? 0.06 : -0.06);
        z = Math.min(3, Math.max(1, z));
        zoom.value = z; zoom.dispatchEvent(new Event('input'));
      }, { passive: false });
      stage.addEventListener('pointerdown', (e) => {
        drag = { x: e.clientX, y: e.clientY, ox, oy };
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', (e) => {
        if (!drag) return;
        ox = drag.ox + (e.clientX - drag.x);
        oy = drag.oy + (e.clientY - drag.y);
        layout();
      });
      stage.addEventListener('pointerup', () => { drag = null; });

      const done = (val) => { back.remove(); resolve(val); };
      back.querySelector('#crop-cancel').addEventListener('click', () => done(null));
      back.addEventListener('mousedown', (e) => { if (e.target === back) done(null); });
      back.querySelector('#crop-apply').addEventListener('click', () => {
        const OUT = 256, s = OUT / V;
        const c = document.createElement('canvas'); c.width = OUT; c.height = OUT;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, OUT, OUT);
        ctx.drawImage(img, ox * s, oy * s, iw * scale * s, ih * scale * s);
        done(c.toDataURL('image/jpeg', 0.9));
      });
    });
  }

  // ── Load ──────────────────────────────────────────────────────────────────
  async function load() {
    const { profiles, prefs, accent, uiFont } = await window.picker.list();
    applyAccent(accent);
    applyFont(uiFont);
    _profiles = profiles;
    _prefs = prefs || {};
    alwaysAsk.checked = !!_prefs.alwaysShowPicker;
    render();
  }
  load();
})();
</script>
</body>
</html>
