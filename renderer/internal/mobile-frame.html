<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Mobile View</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 100vw; height: 100vh;
  /* A defined stage, not the desktop showing through. The soft radial lift
     behind the phone keeps it from looking pasted onto a flat rectangle. */
  background:
    radial-gradient(900px 620px at 50% 42%, #24262d 0%, rgba(36,38,45,0) 70%),
    linear-gradient(180deg, #1a1b20 0%, #101116 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  -webkit-app-region: drag;
  user-select: none;
}

/* ── Phone shell ─────────────────────────────────────────────── */
.phone {
  position: relative;
  width: 393px;
  height: 852px;
  background: linear-gradient(160deg, #2a2a2e 0%, #1c1c1e 40%, #111113 100%);
  border-radius: 54px;
  box-shadow:
    0 0 0 1px #4a4a50,
    0 0 0 3px #1c1c1e,
    0 0 0 4px #3a3a3f,
    0 30px 80px rgba(0,0,0,0.85),
    0 8px 24px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.08);
  flex-shrink: 0;
  -webkit-app-region: drag;
  cursor: grab;
}
.phone:active { cursor: grabbing; }

/* Side volume buttons (left) */
.phone::before {
  content: '';
  position: absolute;
  left: -4px; top: 130px;
  width: 4px; height: 32px;
  background: linear-gradient(to right, #2a2a2e, #3a3a3f);
  border-radius: 3px 0 0 3px;
  box-shadow: 0 52px 0 #3a3a3f, 0 100px 0 #3a3a3f;
}
/* Power button (right) */
.phone::after {
  content: '';
  position: absolute;
  right: -4px; top: 185px;
  width: 4px; height: 72px;
  background: linear-gradient(to left, #2a2a2e, #3a3a3f);
  border-radius: 0 3px 3px 0;
}

/* ── Screen area ─────────────────────────────────────────────── */
.screen {
  position: absolute;
  inset: 12px;
  border-radius: 44px;
  overflow: hidden;
  background: #000;
  -webkit-app-region: no-drag;
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 126px; height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  transform-origin: center top;
}
.dynamic-island.hidden {
  opacity: 0;
  transform: translateX(-50%) scaleY(0);
}

/* Samsung style centred punch-hole camera, used instead of the island */
.punch-hole {
  position: absolute;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  width: 12px; height: 12px;
  background: #000;
  border: 1px solid #1a1a1a;
  border-radius: 50%;
  z-index: 100;
  pointer-events: none;
  display: none;
}
body.device-samsung .punch-hole { display: block; }
body.device-samsung .dynamic-island { display: none; }
body.device-samsung .phone { border-radius: 34px; }
body.device-samsung .screen { border-radius: 26px; }
body.device-samsung { background: #15161a; }

/* ── Content webview ─────────────────────────────────────────── */
webview {
  position: absolute;
  top: 0; left: 0; right: 0;
  bottom: 52px;
  border: none;
  /* Electron paints a webview white until the guest page's own CSS loads
     (a well-known flash-of-white on navigation) — match the phone shell's
     black backdrop instead so it never shows as a stray white panel. */
  background: #000;
}

/* ── Navigation bar ──────────────────────────────────────────── */
.nav {
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 52px;
  background: rgba(18,18,20,0.96);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px;
  z-index: 50;
  -webkit-app-region: no-drag;
}

.nav-btn {
  width: 44px; height: 40px;
  background: none; border: none;
  color: #ffffffbb; cursor: pointer;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s, transform 0.08s;
  -webkit-app-region: no-drag;
}
.nav-btn:hover  { background: rgba(255,255,255,0.1); color: #fff; }
.nav-btn:active { transform: scale(0.88); }
.nav-btn:disabled { opacity: 0.28; pointer-events: none; }

/* Home indicator */
.home-bar {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px;
  background: rgba(255,255,255,0.22);
  border-radius: 3px;
  z-index: 200;
  pointer-events: none;
}

/* ── Corner buttons (top-right) ──────────────────────────────── */
.corner-btns {
  position: fixed;
  top: 18px; right: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  -webkit-app-region: no-drag;
  z-index: 500;
}

.corner-btn {
  width: 34px; height: 34px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, color 0.12s, transform 0.1s;
  backdrop-filter: blur(8px);
  -webkit-app-region: no-drag;
}
.corner-btn:hover  { background: rgba(255,255,255,0.18); color: #fff; }
.corner-btn:active { transform: scale(0.9); }
#btn-close:hover   { background: rgba(220,60,60,0.7); color: #fff; border-color: transparent; }

/* ── Settings popup ──────────────────────────────────────────── */
.mobile-popup {
  position: fixed;
  top: 18px; right: 60px;
  min-width: 186px;
  background: rgba(26,26,30,0.92);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 4px 0;
  backdrop-filter: blur(24px) saturate(160%);
  z-index: 400;
  opacity: 0;
  transform: scale(0.88) translateX(6px);
  pointer-events: none;
  transition: opacity .14s, transform .14s;
  transform-origin: top right;
  -webkit-app-region: no-drag;
}
.mobile-popup.open {
  opacity: 1;
  transform: scale(1) translateX(0);
  pointer-events: all;
}

.popup-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 14px;
  font-family: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.88);
  user-select: none;
}
.popup-row + .popup-row {
  border-top: 1px solid rgba(255,255,255,0.07);
}

.device-seg {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 9px;
  background: rgba(255,255,255,0.08);
}
.device-seg-btn {
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.6);
  font: inherit;
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 9px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.device-seg-btn:hover { color: rgba(255,255,255,0.9); }
.device-seg-btn.active { background: #5b8ef0; color: #fff; }

/* Inline toggle */
.mini-toggle {
  position: relative;
  width: 36px; height: 20px;
  flex-shrink: 0;
  cursor: pointer;
  display: block;
}
.mini-toggle input { opacity:0; width:0; height:0; position:absolute; }
.mini-track {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  background: rgba(255,255,255,0.2);
  transition: background .18s;
}
.mini-toggle input:checked + .mini-track { background: #5b8ef0; }
.mini-thumb {
  position: absolute;
  top: 3px; left: 3px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .18s;
  pointer-events: none;
}
.mini-toggle input:checked ~ .mini-thumb { transform: translateX(16px); }

/* ── Loading spinner ─────────────────────────────────────────── */
.loading {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #0d0d0f;
  z-index: 80;
  transition: opacity 0.3s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 28px; height: 28px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: rgba(255,255,255,0.6);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="dynamic-island" id="dynamic-island"></div>
    <div class="punch-hole"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <webview id="wv" allowpopups></webview>

    <div class="nav">
      <button class="nav-btn" id="btn-back" title="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-fwd" title="Forward">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="Reload">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>

    <div class="home-bar"></div>
  </div>
</div>

<!-- Top-right corner: close + cog -->
<div class="corner-btns">
  <button class="corner-btn" id="btn-close" title="Close">
    <svg viewBox="0 0 14 14" width="12" height="12">
      <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" fill="none"/>
    </svg>
  </button>
  <button class="corner-btn" id="btn-settings" title="Mobile settings">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14 3h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.466.466 0 0 0-.59.22L2.74 8.87a.485.485 0 0 0 .12.61l2.03 1.58c-.04.3-.07.63-.07.94s.03.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </button>
</div>

<!-- Mobile settings popup -->
<div class="mobile-popup" id="mobile-popup">
  <div class="popup-row">
    <span>Device</span>
    <div class="device-seg" id="device-seg">
      <button type="button" class="device-seg-btn" data-device="iphone">iPhone</button>
      <button type="button" class="device-seg-btn" data-device="samsung">Samsung</button>
    </div>
  </div>
  <div class="popup-row" id="island-row">
    <span>Dynamic Island</span>
    <label class="mini-toggle">
      <input type="checkbox" id="toggle-island">
      <div class="mini-track"></div>
      <div class="mini-thumb"></div>
    </label>
  </div>
</div>

<script>
const wv            = document.getElementById('wv');
const btnBack       = document.getElementById('btn-back');
const btnFwd        = document.getElementById('btn-fwd');
const btnReload     = document.getElementById('btn-reload');
const btnClose      = document.getElementById('btn-close');
const btnSettings   = document.getElementById('btn-settings');
const loading       = document.getElementById('loading');
const dynamicIsland = document.getElementById('dynamic-island');
const popup         = document.getElementById('mobile-popup');
const toggleIsland  = document.getElementById('toggle-island');
const deviceSeg     = document.getElementById('device-seg');
const islandRow     = document.getElementById('island-row');
const api           = window.privooMobileFrame;

const DEVICE_UA = {
  iphone: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
  samsung: 'Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/' +
    ((navigator.userAgent.match(/Chrome\/([\d.]+)/) || [])[1] || '142.0.0.0') + ' Mobile Safari/537.36',
};

const params   = new URLSearchParams(location.search);
const startUrl = params.get('url') || '';
let device = params.get('device') === 'samsung' ? 'samsung' : 'iphone';

function applyDevice(next) {
  device = next;
  document.body.classList.toggle('device-samsung', device === 'samsung');
  islandRow.style.display = device === 'samsung' ? 'none' : '';
  deviceSeg.querySelectorAll('.device-seg-btn').forEach((b) => b.classList.toggle('active', b.dataset.device === device));
  wv.setAttribute('useragent', DEVICE_UA[device]);
  try {
    const wcId = wv.getWebContentsId?.();
    if (wcId) api?.markMobileWebview?.(wcId, device);
  } catch { /* not attached yet */ }
}
applyDevice(device);
deviceSeg.querySelectorAll('.device-seg-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (btn.dataset.device === device) return;
    applyDevice(btn.dataset.device);
    api?.setSettings?.({ mobileEmulationDevice: btn.dataset.device }).catch(() => {});
    wv.reload();
  });
});

if (startUrl) wv.setAttribute('src', startUrl);

// getWebContentsId can be unavailable if this runs before the webview has
// actually attached. dom-ready always fires after attach, so retry there
// too, catching the initial navigation before its headers go out.
wv.addEventListener('dom-ready', () => {
  try {
    const wcId = wv.getWebContentsId?.();
    if (wcId) api?.markMobileWebview?.(wcId, device);
  } catch { /* ignore */ }
}, { once: true });

// ── Dynamic Island preference ───────────────────────────────────
const ISLAND_KEY = 'privoo_mobile_island';
const showIsland = localStorage.getItem(ISLAND_KEY) !== 'false';
toggleIsland.checked = showIsland;
if (!showIsland) dynamicIsland.classList.add('hidden');

toggleIsland.addEventListener('change', () => {
  const show = toggleIsland.checked;
  localStorage.setItem(ISLAND_KEY, show ? 'true' : 'false');
  dynamicIsland.classList.toggle('hidden', !show);
});

// ── Settings popup open/close ───────────────────────────────────
btnSettings.addEventListener('click', e => {
  e.stopPropagation();
  popup.classList.toggle('open');
});
document.addEventListener('click', () => popup.classList.remove('open'));
popup.addEventListener('click', e => e.stopPropagation());

// ── Navigation ──────────────────────────────────────────────────
function updateNav() {
  btnBack.disabled = !wv.canGoBack();
  btnFwd.disabled  = !wv.canGoForward();
}

wv.addEventListener('did-start-loading',    () => loading.classList.remove('hidden'));
wv.addEventListener('did-stop-loading',     () => { loading.classList.add('hidden'); updateNav(); });
wv.addEventListener('did-navigate',         () => updateNav());
wv.addEventListener('did-navigate-in-page', () => updateNav());

btnBack.addEventListener('click',   () => { try { wv.goBack();    } catch {} });
btnFwd.addEventListener('click',    () => { try { wv.goForward(); } catch {} });
btnReload.addEventListener('click', () => { try { wv.reload();    } catch {} });
btnClose.addEventListener('click',  () => window.close());
</script>
</body>
</html>
