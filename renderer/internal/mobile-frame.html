<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Mobile View</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 100vw; height: 100vh;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  -webkit-app-region: drag;
  user-select: none;
}

/* ── Phone shell ─────────────────────────────────────────────── */
.phone {
  position: relative;
  width: 393px;
  height: 852px;
  background: linear-gradient(160deg, #2a2a2e 0%, #1c1c1e 40%, #111113 100%);
  border-radius: 54px;
  box-shadow:
    0 0 0 1px #4a4a50,
    0 0 0 3px #1c1c1e,
    0 0 0 4px #3a3a3f,
    0 30px 80px rgba(0,0,0,0.85),
    0 8px 24px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.08);
  flex-shrink: 0;
  -webkit-app-region: drag;
}

/* Side volume buttons (left) */
.phone::before {
  content: '';
  position: absolute;
  left: -4px; top: 130px;
  width: 4px; height: 32px;
  background: linear-gradient(to right, #2a2a2e, #3a3a3f);
  border-radius: 3px 0 0 3px;
  box-shadow: 0 52px 0 #3a3a3f, 0 100px 0 #3a3a3f;
}
/* Power button (right) */
.phone::after {
  content: '';
  position: absolute;
  right: -4px; top: 185px;
  width: 4px; height: 72px;
  background: linear-gradient(to left, #2a2a2e, #3a3a3f);
  border-radius: 0 3px 3px 0;
}

/* ── Screen area ─────────────────────────────────────────────── */
.screen {
  position: absolute;
  inset: 12px;
  border-radius: 44px;
  overflow: hidden;
  background: #000;
  -webkit-app-region: no-drag;
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 126px; height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 100;
  pointer-events: none;
}

/* ── Content webview ─────────────────────────────────────────── */
webview {
  position: absolute;
  top: 0; left: 0; right: 0;
  bottom: 52px;
  border: none;
}

/* ── Navigation bar ──────────────────────────────────────────── */
.nav {
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 52px;
  background: rgba(18,18,20,0.96);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px;
  z-index: 50;
  -webkit-app-region: no-drag;
}

.nav-btn {
  width: 44px; height: 40px;
  background: none; border: none;
  color: #ffffffbb; cursor: pointer;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s, transform 0.08s;
  -webkit-app-region: no-drag;
}
.nav-btn:hover  { background: rgba(255,255,255,0.1); color: #fff; }
.nav-btn:active { transform: scale(0.88); }
.nav-btn:disabled { opacity: 0.28; pointer-events: none; }


/* Home indicator */
.home-bar {
  position: absolute;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  width: 134px; height: 5px;
  background: rgba(255,255,255,0.22);
  border-radius: 3px;
  z-index: 200;
  pointer-events: none;
}

/* ── Close button (outside phone, top-right corner) ─────────── */
.close-btn {
  position: fixed;
  top: 18px; right: 18px;
  width: 34px; height: 34px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, color 0.12s;
  backdrop-filter: blur(8px);
  -webkit-app-region: no-drag;
}
.close-btn:hover { background: rgba(220,60,60,0.7); color: #fff; border-color: transparent; }

/* ── Loading spinner overlay ─────────────────────────────────── */
.loading {
  position: absolute;
  inset: 0; top: 60px;
  display: flex; align-items: center; justify-content: center;
  background: #0d0d0f;
  z-index: 80;
  transition: opacity 0.3s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 28px; height: 28px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: rgba(255,255,255,0.6);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="dynamic-island"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <webview id="wv" allowpopups></webview>

    <div class="nav">
      <button class="nav-btn" id="btn-back" title="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-fwd" title="Forward">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-reload" title="Reload">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
          <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>

    <div class="home-bar"></div>
  </div>
</div>

<button class="close-btn" id="btn-close" title="Close">
  <svg viewBox="0 0 14 14" width="12" height="12">
    <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" fill="none"/>
  </svg>
</button>

<script>
const wv       = document.getElementById('wv');
const btnBack  = document.getElementById('btn-back');
const btnFwd   = document.getElementById('btn-fwd');
const btnReload= document.getElementById('btn-reload');
const btnClose = document.getElementById('btn-close');
const loading  = document.getElementById('loading');

// Read URL from query params passed by main.js via win.loadFile({ query })
const params   = new URLSearchParams(location.search);
const startUrl = params.get('url') || '';

// Set src on the webview element before first paint so Electron attaches the
// renderer with the correct URL rather than navigating away from about:blank.
if (startUrl) {
  wv.setAttribute('src', startUrl);
}

function updateNav() {
  btnBack.disabled = !wv.canGoBack();
  btnFwd.disabled  = !wv.canGoForward();
}

wv.addEventListener('did-start-loading', () => {
  loading.classList.remove('hidden');
});

wv.addEventListener('did-stop-loading', () => {
  loading.classList.add('hidden');
  updateNav();
});

wv.addEventListener('did-navigate', () => {
  updateNav();
});

wv.addEventListener('did-navigate-in-page', (e) => {
  try { urlText.textContent = new URL(e.url).hostname; } catch {}
});

btnBack.addEventListener('click',   () => { try { wv.goBack();   } catch {} });
btnFwd.addEventListener('click',    () => { try { wv.goForward();} catch {} });
btnReload.addEventListener('click', () => { try { wv.reload();   } catch {} });
btnClose.addEventListener('click',  () => window.close());
</script>
</body>
</html>
